name: Build and Test

on:
  pull_request:
    branches: [main]
    # `labeled` so adding `test-image` to an open PR builds an image right away
    # instead of waiting for the next push.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check formatting
        run: dotnet format Inkshelf.sln --verify-no-changes
      - name: Run unit tests
        run: dotnet test tests/Inkshelf.Tests/Inkshelf.Tests.csproj

  image:
    needs: test
    # PRs build an image only when labelled `test-image` — the opt-in loop for
    # trying a branch on a real device. Fork PRs get a read-only token and could
    # not push, so they never qualify.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'test-image'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thomaslazar/inkshelf
          tags: |
            type=ref,event=pr
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
